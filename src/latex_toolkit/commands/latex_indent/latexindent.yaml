defaultIndent: ""

indentRules:
  item: 0
  aligned: "  "
  alignedat: "  "
  split: "  "

noAdditionalIndentGlobal:
  environments: 1
  commands: 1
  optionalArguments: 1
  mandatoryArguments: 1
  ifElseFi: 1
  items: 1
  keyEqualsValuesBracesBrackets: 1
  namedGroupingBracesBrackets: 1
  UnNamedGroupingBracesBrackets: 1
  specialBeginEnd: 1
  afterHeading: 1
  filecontents: 1

lookForAlignDelims:
  align: 1
  align*: 1
  alignat: 1
  alignat*: 1
  aligned: 1
  alignedat: 1
  bmatrix: 1
  Bmatrix: 1
  cases: 1
  flalign: 1
  flalign*: 1
  matrix: 1
  pmatrix: 1
  split: 1
  vmatrix: 1
  Vmatrix: 1

modifyLineBreaks:
  preserveBlankLines: 0
  condenseMultipleBlankLinesInto: 1
  items:
    ItemStartsOnOwnLine: 1
  environments:
    DBSFinishesWithLineBreak: 1
    itemize:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
    itemize*:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
    enumerate:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
    enumerate*:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
    aligned:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
    alignedat:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
    split:
      BeginStartsOnOwnLine: 1
      BodyStartsOnOwnLine: 1
      EndStartsOnOwnLine: 1
      EndFinishesWithLineBreak: 1
