# ==============================================================================
# 1. OUTER INDENTATION SETTINGS (Flush-Left Document Structure)
# ==============================================================================
defaultIndent: ""

indentAfterItems:
  itemize: 0
  itemize*: 0
  enumerate: 0
  enumerate*: 0
  description: 0
  description*: 0
  list: 0

indentAfterHeadings:
  part:
    indentAfterThisHeading: 0
    level: 1
  chapter:
    indentAfterThisHeading: 0
    level: 2
  section:
    indentAfterThisHeading: 0
    level: 3
  subsection:
    indentAfterThisHeading: 0
    level: 4
  subsection*:
    indentAfterThisHeading: 0
    level: 4
  subsubsection:
    indentAfterThisHeading: 0
    level: 5
  paragraph:
    indentAfterThisHeading: 0
    level: 6
  subparagraph:
    indentAfterThisHeading: 0
    level: 7

# Keep environments flush-left by default, then opt a few math structures into
# a readable two-space internal indent.
noAdditionalIndentGlobal:
  environments: 1

indentRules:
  cases: "  "
  matrix: "  "
  pmatrix: "  "
  bmatrix: "  "
  split: "  "
  aligned: "  "

lookForAlignDelims:
  align: 1
  align*: 1
  gather: 1
  gather*: 1
  multline: 1
  cases: 1
  matrix: 1
  pmatrix: 1
  bmatrix: 1
  split: 1
  aligned: 1

# ==============================================================================
# 2. LINE BREAK MODIFICATIONS & PARAGRAPH FLATTENING
# ==============================================================================
modifyLineBreaks:
  textWrapOptions:
    columns: -1
    removeBlockLineBreaks: 1
    multipleSpacesToSingle: 1
    when: before
