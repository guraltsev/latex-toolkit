[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-toolkit"
version = "0.1.0"
description = "Preservation-focused command-line transformations for LaTeX source."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pylatexenc>=3.0a33",
    "pyperclip>=1.9",
    "snapper-fmt==0.7.9",
]

[project.scripts]
math-dollar2latex = "latex_toolkit.math_dollar2latex.math_dollar2latex:main"
math-latex2dollar = "latex_toolkit.math_latex2dollar.math_latex2dollar:main"
template = "latex_toolkit.template.template:main"
brace-args = "latex_toolkit.brace_args.brace_args:main"
sentence-per-line = "latex_toolkit.sentence_per_line.sentence_per_line:main"
syntax-regularizer = "latex_toolkit.syntax_regularizer.syntax_regularizer:main"
eqnum-label = "latex_toolkit.eqnum_label.eqnum_label:main"
full-normalize = "latex_toolkit.full_normalize.full_normalize:main"
greek-unicode2latex = "latex_toolkit.greek_unicode2latex.greek_unicode2latex:main"
greek-latex2unicode = "latex_toolkit.greek_latex2unicode.greek_latex2unicode:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["latex_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
