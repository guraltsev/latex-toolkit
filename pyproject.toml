[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-toolkit"
version = "0.1.0"
description = "Small, composable LaTeX command toolkit with a thin dispatcher and relocatable commands."
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
lt-cli = "lt_cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["lib", "commands"]
py-modules = ["lt_cli"]
include-package-data = true

[tool.setuptools.package-data]
commands = ["*/*.py", "*/*.md"]
