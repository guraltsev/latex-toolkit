[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sentence-per-line-transformer"
version = "0.1.0"
description = "A preservation-focused sentence-per-line formatter for LaTeX."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pylatexenc>=3.0a33",
    "pyperclip>=1.9",
    "snapper-fmt==0.7.9",
]

[project.scripts]
sentence-per-line = "sentence_per_line_transformer.sentence_per_line_transformer:main"
latex-syntax-regularizer = "syntax_regularizer.syntax_regularizer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sentence_per_line_transformer*", "syntax_regularizer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
