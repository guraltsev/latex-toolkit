[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-toolkit"
version = "0.1.0"
description = "Preservation-focused command-line transformations for LaTeX source."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pylatexenc>=3.0a33",
    "pyperclip>=1.9",
    "snapper-fmt==0.7.9",
]

[project.scripts]
dollar-math-to-latex-delimiters = "latex_toolkit.dollar_math_to_latex_delimiters.dollar_math_to_latex_delimiters:main"
latex-delimiters-to-dollar-math = "latex_toolkit.latex_delimiters_to_dollar_math.latex_delimiters_to_dollar_math:main"
latex-transformer-template = "latex_toolkit.latex_transformer_template.latex_transformer_template:main"
latex-argument-bracer = "latex_toolkit.latex_argument_bracer.latex_argument_bracer:main"
sentence-per-line-transformer = "latex_toolkit.sentence_per_line_transformer.sentence_per_line_transformer:main"
syntax-regularizer = "latex_toolkit.syntax_regularizer.syntax_regularizer:main"
full-normalize = "latex_toolkit.full_normalize.full_normalize:main"
sentence-per-line = "latex_toolkit.sentence_per_line_transformer.sentence_per_line_transformer:main"
latex-syntax-regularizer = "latex_toolkit.syntax_regularizer.syntax_regularizer:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["latex_toolkit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "src"]
