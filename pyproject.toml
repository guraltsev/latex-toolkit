[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-toolkit"
version = "0.1.0"
description = "Small, composable LaTeX command toolkit with python -m command modules."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["pyperclip>=1.9"]

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true

[tool.setuptools.packages.find]
where = ["src"]
include = ["latex_toolkit*"]
exclude = [
    "latex_toolkit.commands.test*",
    "latex_toolkit.commands.*.test*",
    "latex_toolkit.commands.*.test.*",
]

[tool.setuptools.package-data]
"latex_toolkit.commands" = ["*/*.md", "*/*.yaml"]
