[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latex-transformer-template"
version = "0.1.0"
description = "A documented pylatexenc template for file and clipboard transforms."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pylatexenc>=3.0a33",
    "pyperclip>=1.9",
]

[project.scripts]
latex-transformer = "latex_transformer_template.latex_transformer_template:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["latex_transformer_template*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
