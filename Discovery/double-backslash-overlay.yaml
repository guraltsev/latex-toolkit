defaultIndent: ''
indentRules:
  item: 0
  aligned: '  '
  alignedat: '  '
  split: '  '
lookForAlignDelims:
  align: 1
  align*: 1
  alignat: 1
  alignat*: 1
  aligned:
    delims: 1
    alignDoubleBackSlash: 0
    spacesBeforeDoubleBackSlash: 0
    alignContentAfterDoubleBackSlash: 1
    spacesAfterDoubleBackSlash: 0
  alignedat:
    delims: 1
    alignDoubleBackSlash: 0
    spacesBeforeDoubleBackSlash: 0
    alignContentAfterDoubleBackSlash: 1
    spacesAfterDoubleBackSlash: 0
  split:
    delims: 1
    alignDoubleBackSlash: 0
    spacesBeforeDoubleBackSlash: 0
    alignContentAfterDoubleBackSlash: 1
    spacesAfterDoubleBackSlash: 0
  bmatrix: 1
  Bmatrix: 1
  cases: 1
  flalign: 1
  flalign*: 1
  matrix: 1
  pmatrix: 1
  vmatrix: 1
  Vmatrix: 1
modifyLineBreaks:
  preserveBlankLines: 0
  condenseMultipleBlankLinesInto: 1
  environments:
    DBSFinishesWithLineBreak: 1
